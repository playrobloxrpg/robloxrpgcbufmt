    const p0=c.clone().add(new THREE.Vector3(Math.cos(ang)*f.r0*s,0,Math.sin(ang)*f.r0*s)).applyMatrix4(W),p1=c.clone().add(new THREE.Vector3(Math.cos(ang)*f.r1*s,f.subida*s,Math.sin(ang)*f.r1*s)).applyMatrix4(W);const m=bloco(f.cor);
    efeito(f.dur,k=>{const e=easeOut(k);const M=rot.clone();M.setPosition(p0.clone().lerp(p1,e));m.matrix.copy(escala(M,[.25*tam,.25*tam,.9*tam]));m.material.opacity=1-e;if(k>=1)S.remove(m);});}},
};
function rede(p){const cor=[230,230,240];const n=10;for(let i=0;i<n;i++){const a=i/n*Math.PI*2,a2=a+Math.PI*2/n;for(const r of[1.4,2.8]){const p0=p.clone().add(new THREE.Vector3(Math.cos(a)*r,.1,Math.sin(a)*r)),p1=p.clone().add(new THREE.Vector3(Math.cos(a2)*r,.1,Math.sin(a2)*r));const m=bloco(cor,false);
  efeito(2.2,k=>{const t=k*2.2;m.matrix.copy(escala(olhar(p0.clone().add(p1).multiplyScalar(.5),p1,new THREE.Vector3(0,1,0)),[.12,.12,p0.distanceTo(p1)]));m.material.opacity=t<1.6?.85:.85*(1-(t-1.6)/.6);if(k>=1)S.remove(m);});}
  const pt=p.clone().add(new THREE.Vector3(Math.cos(a)*3.2,.1,Math.sin(a)*3.2)),m=bloco(cor,false);const mid=p.clone().add(pt).multiplyScalar(.5);mid.y+=.1;const alvo=pt.clone();alvo.y+=.1;
  efeito(2.2,k=>{const t=k*2.2;m.matrix.copy(escala(olhar(mid,alvo,new THREE.Vector3(0,1,0)),[.12,.12,3.2]));m.material.opacity=t<1.6?.85:.85*(1-(t-1.6)/.6);if(k>=1)S.remove(m);});}}
function golpe(a,nome,W){if(nome==='Teia'&&a.chefe){const cab=a.corpo.find(c=>c.mesh&&c.grupo==='Cabeca');const de=new THREE.Vector3().setFromMatrixPosition(cab.mesh.matrix);
  const para=new THREE.Vector3(0,0,-16).applyMatrix4(W);para.y=0;const m=bloco([230,230,240],false);
  efeito(.4,k=>{m.matrix.copy(escala(new THREE.Matrix4().makeTranslation(...de.clone().lerp(para,k).toArray()),[1.2,1.2,1.2]));if(k>=1){S.remove(m);rede(para);}});}}
// estados
function tocar(a,n){if(n==='Reviver'){a.morta=false;n='Parado';}else if(a.morta&&n!=='Morte')return;if(!animDe(a,n))return;if(n==='Morte')a.morta=true;a.de=a.ultima;a.deT=0;a.anim=n;a.t=0;a.disp={};a.golpeFeito=false;
  if(n==='Furia')luzC.intensity=3;}
const MIX=.15;let foco=0;
function atualizar(a,dt){let an=animDe(a,a.anim);a.t+=dt;
  if(an.loop)a.t%=an.dur;else if(a.t>=an.dur){if(an.segura)a.t=an.dur;else{tocar(a,'Parado');an=animDe(a,'Parado');}}
  const peso=an.passo?1:0;a.peso+=(peso-a.peso)*Math.min(1,dt*6);if(a.peso>.01)a.ciclo=(a.ciclo+dt*a.freq)%1;
  if(an.passo){const vel=a.chefe?3.2:2.4;a.yaw+=dt*(a.chefe?.25:.6);a.pos.add(new THREE.Vector3(-Math.sin(a.yaw),0,-Math.cos(a.yaw)).multiplyScalar(vel*dt));}
  let pose=poseEm(an,a.t);if(a.de&&a.deT<MIX){a.deT+=dt;pose=misturar(a.de,pose,suave(Math.min(1,a.deT/MIX)));}a.ultima=pose;
  const W=aplicar(a,pose);
  if(an.fx)an.fx.forEach((f,i)=>{if(!a.disp[i]&&a.t>=f.t){a.disp[i]=true;FX[f.fx]&&FX[f.fx](a,f,W);}});
  if(an.golpe&&!a.golpeFeito&&a.t>=an.golpe){a.golpeFeito=true;golpe(a,a.anim,W);}
  if(a.chefe){luzC.position.copy(new THREE.Vector3(0,8,3).applyMatrix4(W));if(a.anim!=='Furia')luzC.intensity+=(1.2-luzC.intensity)*Math.min(1,dt*2);}
}
const info=document.getElementById('info');
const TEXTO=['A Tecelã: 300 de vida · mordida 20 · cuspe de teia 6 e prende por 3 s · fúria com metade da vida','Cria de aranha: 30 de vida · mordida 8 · persegue quem chega perto do beco'];
function setFoco(q){foco=q;document.querySelectorAll('#quem button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.q===q));document.querySelectorAll('.chefe').forEach(b=>b.hidden=q!==0);info.textContent=TEXTO[q];
  const a=ARANHAS[q];alvoCam=q===0?{p:a.pos.clone().add(new THREE.Vector3(22,18,30)),t:a.pos.clone().add(new THREE.Vector3(0,4,0))}:{p:a.pos.clone().add(new THREE.Vector3(5,4,7)),t:a.pos.clone().add(new THREE.Vector3(0,.8,0))};}
document.querySelectorAll('#quem button').forEach(b=>b.onclick=()=>setFoco(+b.dataset.q));
document.querySelectorAll('#acoes button').forEach(b=>b.onclick=()=>tocar(ARANHAS[foco],b.dataset.a));
let alvoCam=null;cam.position.set(22,18,30);
const ctl=new THREE.OrbitControls(cam,R.domElement);ctl.target.set(0,4,0);ctl.enableDamping=true;ctl.minDistance=3;ctl.maxDistance=120;ctl.maxPolarAngle=Math.PI*.49;
R.domElement.addEventListener('pointerdown',()=>alvoCam=null);R.domElement.addEventListener('wheel',()=>alvoCam=null,{passive:true});
setFoco(0);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}addEventListener('resize',rs);rs();
let ult=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.1,(now-ult)/1000);ult=now;
  for(const a of ARANHAS)atualizar(a,dt);
  for(let i=vivos.length-1;i>=0;i--){const v=vivos[i];v.t+=dt;if(v.t<0)continue;const k=Math.min(1,v.t/v.dur);v.upd(k);if(k>=1)vivos.splice(i,1);}
  if(alvoCam){cam.position.lerp(alvoCam.p,.08);ctl.target.lerp(alvoCam.t,.08);if(cam.position.distanceTo(alvoCam.p)<.05)alvoCam=null;}
  ctl.update();R.render(S,cam);})(performance.now());
</script></body></html>
