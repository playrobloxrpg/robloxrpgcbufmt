 coluna(B,f){const c=ponto(B,V(f.c)),up=eixo(B,1),m=bloco(f.cor);efeito(f.dur,k=>{const e=easeOut(k),h=.1+(f.h-.1)*e,w=f.w+(f.w*.5-f.w)*e;const M=rotDe(B);M.setPosition(c.clone().addScaledVector(up,h/2));m.matrix.copy(comTam(M,w,h,w));m.material.opacity=.8*(1-e);if(k>=1)S.remove(m);});},
 fumaca(B,f){const c=ponto(B,V(f.c));for(let i=1;i<=f.n;i++){const a=i/f.n*Math.PI*2,d=new THREE.Vector3(Math.cos(a)*1.6,1+Math.random()*1.5,Math.sin(a)*1.6),m=bloco([46,36,60],false);efeito(.6,k=>{const e=easeOut(k),s=.9+(.3-.9)*e;const M=new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(a*e,0,a*e));M.setPosition(c.clone().addScaledVector(d,e));m.matrix.copy(comTam(M,s,s,s));m.material.opacity=.8*(1-e);if(k>=1)S.remove(m);});}},
 chuva(B,f){const c=V(f.c);for(let i=1;i<=f.n;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*f.raio;const ch=ponto(B,c.clone().add(new THREE.Vector3(Math.cos(a)*r,.6,Math.sin(a)*r))),alto=ch.clone().add(new THREE.Vector3(0,14,0)),m=bloco(f.cor),dn=new THREE.Vector3(0,-1,0),z=new THREE.Vector3(0,0,1);
   efeito(.85,k=>{const t=k*.85;const q=Math.min(1,t/.35);const p=alto.clone().lerp(ch,q);m.matrix.copy(comTam(olhar(p,p.clone().add(dn),z),.25,.25,2.2));m.material.opacity=t<.35?1:1-(t-.35)/.5;if(k>=1)S.remove(m);},i*.05);}},
};
// ===== interface =====
let VIT=true,foco='todos';
const vit=document.getElementById('vit');vit.onclick=()=>{VIT=!VIT;vit.setAttribute('aria-pressed',VIT);vit.textContent=VIT?'Treino automático ligado':'Treino automático desligado';};
const cls=document.getElementById('classes'),golpes=document.getElementById('golpes');
function setFoco(f){foco=f;cls.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===f));
  if(f==='todos'){golpes.innerHTML='Escolha uma classe para ver os golpes dela de perto';alvoCam={p:new THREE.Vector3(0,10,40),t:new THREE.Vector3(0,4,14.6)};}
  else{const c=P.find(x=>x.classe===f);const g=GOLPES[f];golpes.innerHTML='<b>'+NOMES[f]+'</b> · Ataque: '+g[0]+' · Habilidade: '+g[1];const front=eixo(c.B,2).multiplyScalar(-1);alvoCam={p:c.pos.clone().addScaledVector(new THREE.Vector3(0,0,1),14).add(new THREE.Vector3(6,6,0)),t:c.pos.clone().add(new THREE.Vector3(0,3.5,-3))};}}
[['todos','Todos'],...D.modelos.map(m=>[m.classe,NOMES[m.classe]])].forEach(([c,n])=>{const b=document.createElement('button');b.dataset.c=c;b.textContent=n;b.onclick=()=>setFoco(c);cls.append(b);});
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{for(const c of P){if(foco==='todos'||c.classe===foco){tocar(c,b.dataset.a);c.espera=4;}}});
let alvoCam=null;
cam.position.set(0,10,40);
const ctl=new THREE.OrbitControls(cam,R.domElement);ctl.target.set(0,4,14.6);ctl.enableDamping=true;ctl.minDistance=5;ctl.maxDistance=90;ctl.maxPolarAngle=Math.PI*.49;
R.domElement.addEventListener('pointerdown',()=>{alvoCam=null;});
R.domElement.addEventListener('wheel',()=>{alvoCam=null;},{passive:true});
setFoco('todos');
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}addEventListener('resize',rs);rs();
const MIX=.12;let ult=performance.now();
function atualizar(c,dt){let a=animDe(c.classe,c.anim);c.t+=dt;
  if(a.loop){if(c.t>a.dur)c.t%=a.dur;if(VIT){c.espera-=dt;if(c.espera<=0){tocar(c,SEQ[c.passo]);c.passo=(c.passo+1)%SEQ.length;c.espera=2.2;a=animDe(c.classe,c.anim);}}}
  else if(c.t>=a.dur){tocar(c,'Parado');a=animDe(c.classe,'Parado');}
  let pose=poseEm(a,c.t);
  if(c.de&&c.deT<MIX){c.deT+=dt;pose=misturar(c.de,pose,suave(Math.min(1,c.deT/MIX)));}
  c.ultima=JSON.parse(JSON.stringify(pose));
  if(a.fx)a.fx.forEach((f,i)=>{if(!c.disp[i]&&c.t>=f.t){c.disp[i]=true;FX[f.fx]&&FX[f.fx](c.B,f);}});
  const T=transf(pose);
  for(const pc of c.pecas){const M=c.B.clone().multiply(T[pc.membro]);pc.mesh.matrix.copy(M.clone().multiply(pc.off));pc.o.matrix.copy(M.multiply(pc.offO));}}
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.1,(now-ult)/1000);ult=now;
  for(const c of P)atualizar(c,dt);
  for(let i=vivos.length-1;i>=0;i--){const v=vivos[i];v.t+=dt;if(v.t<0)continue;const k=Math.min(1,v.t/v.dur);v.upd(k);if(k>=1)vivos.splice(i,1);}
  if(alvoCam){cam.position.lerp(alvoCam.p,.08);ctl.target.lerp(alvoCam.t,.08);if(cam.position.distanceTo(alvoCam.p)<.05)alvoCam=null;}
  ctl.update();R.render(S,cam);})(performance.now());
